<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>襄河一号 · 销控图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 18px 15px 14px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .header h1 { font-size: 21px; font-weight: 600; margin-bottom: 10px; }
        .header .stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .header .stat { background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; font-size: 13px; }
        .header .stat b { font-weight: 600; }
        .building-nav {
            padding: 12px 10px;
            background: rgba(255,255,255,0.05);
            position: sticky;
            top: 72px;
            z-index: 99;
            backdrop-filter: blur(10px);
        }
        .building-scroll {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 5px 10px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .building-scroll::-webkit-scrollbar { display: none; }
        .building-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .building-btn:hover { background: rgba(102, 126, 234, 0.4); }
        .building-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 12px;
            margin: 12px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            font-size: 12px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
        .legend-dot.sold { background: #4ade80; }
        .legend-dot.subscribed { background: #fbbf24; }
        .legend-dot.unsold { background: #6b7280; }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 12px 10px;
            background: rgba(255,255,255,0.05);
            margin: 0 15px 15px;
            border-radius: 12px;
        }
        .stat-item { text-align: center; }
        .stat-item .num { font-size: 20px; font-weight: 700; }
        .stat-item .label { font-size: 11px; opacity: 0.6; margin-top: 2px; }
        .num.sold { color: #4ade80; }
        .num.subscribed { color: #fbbf24; }
        .num.unsold { color: #9ca3af; }
        .sales-grid {
            padding: 10px 12px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 10px;
        }
        .room-card {
            background: rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .room-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .room-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .room-card.unsold:hover { border-color: rgba(251,191,36,0.4); cursor: pointer; }
        .room-card.subscribed:hover { border-color: rgba(251,191,36,0.3); cursor: pointer; }
        .room-card.sold { cursor: default; }
        .room-card.sold { background: linear-gradient(180deg, rgba(74, 222, 128, 0.12) 0%, rgba(74, 222, 128, 0.05) 100%); border-color: rgba(74, 222, 128, 0.25); }
        .room-card.sold::after { background: #4ade80; opacity: 1; }
        .room-card.subscribed { background: linear-gradient(180deg, rgba(251, 191, 36, 0.12) 0%, rgba(251, 191, 36, 0.05) 100%); border-color: rgba(251, 191, 36, 0.25); }
        .room-card.subscribed::after { background: #fbbf24; opacity: 1; }
        .room-card.unsold { background: rgba(255,255,255,0.05); }
        .room-card.unsold::after { background: #6b7280; opacity: 1; }
        .room-number { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .room-info { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
        .room-price-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 6px; }
        .room-price-item { text-align: center; }
        .room-price-item .price { font-size: 12px; color: #fbbf24; font-weight: 600; }
        .room-price-item .label { font-size: 9px; color: rgba(255,255,255,0.4); }
        .room-customer {
            font-size: 10px;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.15);
            padding: 3px 8px;
            border-radius: 8px;
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .room-customer.yellow {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.15);
        }
        .room-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 500;
            margin-top: 8px;
        }
        .status-signed { background: #4ade80; color: #000; }
        .status-subscribed { background: #fbbf24; color: #000; }
        .status-unsold { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.15); }
        .tap-hint {
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 9px;
            color: rgba(255,255,255,0.25);
        }

        /* ======= 弹窗 ======= */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #1e2a3a;
            border-radius: 20px 20px 0 0;
            padding: 28px 24px 40px;
            width: 100%;
            max-width: 500px;
            animation: slideUp 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin: 0 auto 20px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 6px;
        }
        .modal-sub {
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 22px;
        }
        .modal-room-info {
            background: rgba(255,255,255,0.07);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .modal-info-item { text-align: center; }
        .modal-info-item .val { font-size: 16px; font-weight: 600; color: #fbbf24; }
        .modal-info-item .lbl { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }
        .modal-label {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
        }
        .modal-input {
            width: 100%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 16px;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 14px;
        }
        .modal-input:focus { border-color: #667eea; }
        .modal-input::placeholder { color: rgba(255,255,255,0.3); }
        .modal-btn-row {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .modal-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .modal-btn:active { opacity: 0.85; }
        .modal-btn-cancel {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
        }
        .modal-btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .modal-btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            flex: unset;
            padding: 14px 18px;
        }
        .modal-btn-convert {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            flex: unset;
            padding: 14px 18px;
        }
        .modal-tip {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            text-align: center;
            margin-top: 10px;
        }

        .bottom-space { height: 40px; }
        @media (max-width: 380px) {
            .sales-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .room-card { padding: 12px 8px; }
        }
    </style>
</head>

": "商铺", "layout": "-㎡", "area": 113.2, "price": 18000.0, "total": 2037600.0, "dealPrice": 0, "dealTotal": 0, "customer": "-", "signDate": "", "signStatus": "", "invoiceStatus": "", "receiveStatus": "", "gift": ""}, {"building": "19商铺#", "room": "105", "type": "商铺", "layout": "-㎡", "area": 58.57, "price": 18000.0, "total": 1054260.0, "dealPrice": 0, "dealTotal": 0, "customer": "-", "signDate": "", "signStatus": "", "invoiceStatus": "", "receiveStatus": "", "gift": ""}, {"building": "20商铺#", "room": "101", "type": "商铺", "layout": "-㎡", "area": 53.65, "price": 18000.0, "total": 965700.0, "dealPrice": 0, "dealTotal": 0, "customer": "-", "signDate": "", "signStatus": "", "invoiceStatus": "", "receiveStatus": "", "gift": ""}, {"building": "20商铺#", "room": "102", "type": "商铺", "layout": "-㎡", "area": 52.45, "price": 18000.0, "total": 944100.0, "dealPrice": 0, "dealTotal": 0, "customer": "-", "signDate": "", "signStatus": "", "invoiceStatus": "", "receiveStatus": "", "gift": ""}, {"building": "20商铺#", "room": "103", "type": "商铺", "layout": "-㎡", "area": 107.27, "price": 18000.0, "total": 1930860.0, "dealPrice": 0, "dealTotal": 0, "customer": "-", "signDate": "", "signStatus": "", "invoiceStatus": "", "receiveStatus": "", "gift": ""}, {"building": "20商铺#", "room": "104", "type": "商铺", "layout": "-㎡", "area": 97.34, "price": 18000.0, "total": 1752120.0, "dealPrice": 0, "dealTotal": 0, "customer": "-", "signDate": "", "signStatus": "", "invoiceStatus": "", "receiveStatus": "", "gift": ""}, {"building": "20商铺#", "room": "105", "type": "商铺", "layout": "-㎡", "area": 92.11, "price": 18000.0, "total": 1657980.0, "dealPrice": 0, "dealTotal": 0, "customer": "彭金志1", "signDate": "", "signStatus": "", "invoiceStatus": "", "receiveStatus": "", "gift": ""}, {"building": "20商铺#", "room": "106", "type": "商铺", "layout": "-㎡", "area": 92.77, "price": 18888.89, "total": 1752322.0, "dealPrice": 0, "dealTotal": 0, "customer": "彭金志1", "signDate": "", "signStatus": "", "invoiceStatus": "", "receiveStatus": "", "gift": ""}];

        let currentBuilding = '1#';
        let currentRoomIndex = -1;  // allData 中的索引
        let localData = JSON.parse(localStorage.getItem('xianghe_local') || '{}');

        function getLocalKey(idx) { return 'room_' + idx; }

        function getStatus(d, idx) {
            const local = localData[getLocalKey(idx)];
            if (local && local.signStatus === '已网签') return 'sold';
            if (d.signStatus === '已网签' || (local && local.signStatus === '已网签')) return 'sold';
            if (local && local.customer && local.customer !== '-') return 'subscribed';
            if (d.signStatus === '已网签') return 'sold';
            if (d.customer && d.customer !== '-') return 'subscribed';
            return 'unsold';
        }

        function getCustomer(d, idx) {
            const local = localData[getLocalKey(idx)];
            if (local && local.customer) return local.customer;
            return d.customer || '-';
        }

        function getStatusText(d, idx) {
            const st = getStatus(d, idx);
            if (st === 'sold') return '已网签';
            if (st === 'subscribed') return '认购';
            return '待售';
        }

        function initBuildingNav() {
            const buildings = [...new Set(allData.map((d, i) => JSON.stringify({b: d.building, i})))]
                .map(s => JSON.parse(s))
                .filter((v, idx, arr) => arr.findIndex(x => x.b === v.b) === idx)
                .map(v => v.b);
            // 排序
            const sortKey = b => {
                const m = b.match(/^([^\d]*)(\d*)/);
                return (parseInt(m[2]||'999') * 10000) + (m[1] < b ? 0 : 1);
            };
            const sorted = buildings.sort((a, b) => sortKey(a) - sortKey(b));
            // 去重并排序
            const seen = new Set();
            const ordered = [];
            sorted.forEach(b => { if (!seen.has(b)) { seen.add(b); ordered.push(b); } });
            const scroll = document.getElementById('buildingScroll');
            scroll.innerHTML = ordered.map(b =>
                `<button class="building-btn ${b === currentBuilding ? 'active' : ''}" onclick="selectBuilding('${b}')">${b}</button>`
            ).join('');
        }

        function selectBuilding(building) {
            currentBuilding = building;
            document.querySelectorAll('.building-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.trim() === building);
            });
            updateSalesGrid();
        }

        function updateSalesGrid() {
            const grid = document.getElementById('salesGrid');
            const filtered = allData
                .map((d, i) => ({d, i}))
                .filter(x => x.d.building === currentBuilding)
                .sort((a, b) => {
                    const fa = parseInt(a.d.room.replace(/[^0-9]/g,'')) || 0;
                    const fb = parseInt(b.d.room.replace(/[^0-9]/g,'')) || 0;
                    return fb - fa;
                });

            let sold = 0, sub = 0, unsold = 0;
            filtered.forEach(({d, i}) => {
                const st = getStatus(d, i);
                if (st === 'sold') sold++;
                else if (st === 'subscribed') sub++;
                else unsold++;
            });

            document.getElementById('currentTotal').textContent = filtered.length;
            document.getElementById('currentSigned').textContent = sold;
            document.getElementById('currentSub').textContent = sub;
            document.getElementById('currentUnsold').textContent = unsold;

            grid.innerHTML = filtered.map(({d, i}) => {
                const status = getStatus(d, i);
                const statusText = getStatusText(d, i);
                const customer = getCustomer(d, i);
                const isLocal = localData[getLocalKey(i)];
                const unitPrice = (d.dealPrice > 0 ? d.dealPrice : d.price);
                const totalPrice = (d.dealTotal > 0 ? d.dealTotal : d.total);
                const customerHtml = customer && customer !== '-' ?
                    `<div class="room-customer ${status==='subscribed'?'yellow':''}">${customer}</div>` : '';
                const tapHint = status !== 'sold' ? '<div class="tap-hint">点击</div>' : '';
                const isSubscribedByLocal = isLocal && isLocal.customer && isLocal.customer !== '-';

                return `<div class="room-card ${status}" onclick="openModal(${i})">
                    <div class="room-number">${d.room}</div>
                    <div class="room-info">${d.layout} · ${d.area.toFixed(1)}㎡</div>
                    <div class="room-price-row">
                        <div class="room-price-item">
                            <div class="price">${unitPrice.toLocaleString()}</div>
                            <div class="label">单价/㎡</div>
                        </div>
                        <div class="room-price-item">
                            <div class="price">${(totalPrice/10000).toFixed(0)}</div>
                            <div class="label">总价万</div>
                        </div>
                    </div>
                    ${customerHtml}
                    <span class="room-status status-${status==='sold'?'signed':status==='subscribed'?'subscribed':'unsold'}">${statusText}</span>
                    ${tapHint}
                </div>`;
            }).join('');
        }

        // ====== 弹窗逻辑 ======
        function openModal(idx) {
            currentRoomIndex = idx;
            const d = allData[idx];
            const status = getStatus(d, idx);
            const customer = getCustomer(d, idx);
            const unitPrice = (d.dealPrice > 0 ? d.dealPrice : d.price);
            const totalPrice = (d.dealTotal > 0 ? d.dealTotal : d.total);

            document.getElementById('modalRoomInfo').innerHTML =
                `<div class="modal-info-item"><div class="val">${d.building} ${d.room}</div><div class="lbl">房源</div></div>` +
                `<div class="modal-info-item"><div class="val">${d.layout}</div><div class="lbl">户型</div></div>` +
                `<div class="modal-info-item"><div class="val">${unitPrice.toLocaleString()}</div><div class="lbl">单价元/㎡</div></div>` +
                `<div class="modal-info-item"><div class="val">${(totalPrice/10000).toFixed(0)}万</div><div class="lbl">总价</div></div>`;

            if (status === 'unsold') {
                // 待售 → 录入认购
                document.getElementById('modalTitle').textContent = '认购录入';
                document.getElementById('modalSub').textContent = '录入客户姓名，该房源将被标记为「认购」';
                document.getElementById('modalLabel').textContent = '客户姓名';
                document.getElementById('modalInput').value = '';
                document.getElementById('modalInput').placeholder = '请输入客户姓名';
                document.getElementById('modalInput').removeAttribute('disabled');
                document.getElementById('modalBtnRow').innerHTML =
                    `<button class="modal-btn modal-btn-cancel" onclick="closeModal()">取消</button>
                     <button class="modal-btn modal-btn-save" onclick="saveCustomer()">确认保存</button>`;
            } else if (status === 'subscribed') {
                // 认购 → 可修改客户名 或 转为已网签 或 删除认购
                document.getElementById('modalTitle').textContent = '认购管理';
                document.getElementById('modalSub').textContent = '当前客户：' + customer;
                document.getElementById('modalLabel').textContent = '修改客户姓名';
                document.getElementById('modalInput').value = customer;
                document.getElementById('modalInput').removeAttribute('disabled');
                document.getElementById('modalBtnRow').innerHTML =
                    `<button class="modal-btn modal-btn-delete" onclick="deleteLocal(${idx})">删除认购</button>
                     <button class="modal-btn modal-btn-convert" onclick="convertToSigned(${idx})">转为已网签</button>
                     <button class="modal-btn modal-btn-save" onclick="saveCustomer()">保存</button>`;
            } else {
                // 已网签 → 查看详情
                document.getElementById('modalTitle').textContent = '已网签';
                document.getElementById('modalSub').textContent = '该房源已完成网签';
                document.getElementById('modalLabel').textContent = '客户姓名';
                document.getElementById('modalInput').value = customer;
                document.getElementById('modalInput').setAttribute('disabled', 'true');
                document.getElementById('modalBtnRow').innerHTML =
                    `<button class="modal-btn modal-btn-cancel" onclick="closeModal()">关闭</button>`;
            }

            document.getElementById('modalOverlay').classList.add('show');
            setTimeout(() => document.getElementById('modalInput').focus(), 300);
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            currentRoomIndex = -1;
        }

        function saveCustomer() {
            const name = document.getElementById('modalInput').value.trim();
            if (!name) { alert('请输入客户姓名'); return; }
            const idx = currentRoomIndex;
            localData[getLocalKey(idx)] = { customer: name, signStatus: '' };
            localStorage.setItem('xianghe_local', JSON.stringify(localData));
            closeModal();
            updateSalesGrid();
            updateGlobalStats();
        }

        function deleteLocal(idx) {
            if (!confirm('确认删除该认购记录？')) return;
            delete localData[getLocalKey(idx)];
            localStorage.setItem('xianghe_local', JSON.stringify(localData));
            closeModal();
            updateSalesGrid();
            updateGlobalStats();
        }

        function convertToSigned(idx) {
            localData[getLocalKey(idx)] = { customer: getCustomer(allData[idx], idx), signStatus: '已网签' };
            localStorage.setItem('xianghe_local', JSON.stringify(localData));
            closeModal();
            updateSalesGrid();
            updateGlobalStats();
        }

        function updateGlobalStats() {
            let sold = 0, sub = 0;
            allData.forEach((d, i) => {
                const st = getStatus(d, i);
                if (st === 'sold') sold++;
                else if (st === 'subscribed') sub++;
            });
            document.getElementById('totalCount').textContent = allData.length;
            document.getElementById('signedCount').textContent = sold;
            document.getElementById('subCount').textContent = sub;
            document.getElementById('remainCount').textContent = allData.length - sold - sub;
        }

        // 初始化
        initBuildingNav();
        updateSalesGrid();
        updateGlobalStats();
    </script>
