<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>襄河·1号 · 楼盘展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #faf8f5 0%, #f0ebe2 100%);
            color: #2c2c2c;
            min-height: 100vh;
        }
        .hero {
            background: linear-gradient(135deg, #8b6f47 0%, #6b5435 100%);
            color: #fff;
            padding: 50px 20px 40px;
            text-align: center;
        }
        .hero .brand {
            font-size: 12px;
            letter-spacing: 4px;
            opacity: 0.7;
            margin-bottom: 12px;
        }
        .hero h1 {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 6px;
            margin-bottom: 8px;
            font-family: 'STSong', '宋体', serif;
        }
        .hero .tag {
            display: inline-block;
            background: rgba(255,255,255,0.18);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }
        .hero .sub {
            font-size: 13px;
            opacity: 0.85;
            letter-spacing: 1px;
        }
        .section {
            padding: 28px 16px;
            max-width: 900px;
            margin: 0 auto;
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #6b5435;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e8dfd0;
        }
        .section-title::before {
            content: '';
            display: block;
            width: 4px;
            height: 18px;
            background: #8b6f47;
            border-radius: 2px;
        }
        .section-sub {
            font-size: 12px;
            color: #999;
            margin-bottom: 16px;
        }

        /* 总平图 */
        .plan-img-wrap {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }
        .plan-img {
            width: 100%;
            border-radius: 8px;
            display: block;
        }
        .plan-img-wrap {
            position: relative;
        }
        .plan-hotspots {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .plan-hint {
            text-align: center;
            color: #bbb;
            font-size: 12px;
            padding: 8px;
        }
        .hs {
            position: absolute;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 2px solid rgba(74,144,217,0.8);
            background: rgba(74,144,217,0.25);
            transition: all 0.2s;
            overflow: hidden;
        }
        .hs:hover {
            background: rgba(255,200,50,0.4) !important;
            border-color: #ffc832 !important;
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 4px 16px rgba(255,200,50,0.5);
        }
        .hs-label {
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            line-height: 1.2;
            background: rgba(0,0,0,0.6);
            padding: 3px 6px;
            border-radius: 4px;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .hs:hover .hs-label {
            background: rgba(200,140,0,0.85);
        }
        .hs.shop {
            border-color: rgba(224,112,64,0.8) !important;
            background: rgba(224,112,64,0.25) !important;
        }
        .hs.shop:hover {
            background: rgba(255,200,50,0.4) !important;
            border-color: #ffc832 !important;
        }
        .building-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
            background: #fff;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .building-chip {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 4px;
            background: linear-gradient(135deg, #faf6ed 0%, #f0e8d8 100%);
            border: 1.5px solid #e8dfd0;
            border-radius: 10px;
            color: #6b5435;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .building-chip:hover {
            background: linear-gradient(135deg, #8b6f47 0%, #6b5435 100%);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 111, 71, 0.25);
        }
        .building-chip.shop {
            background: #fef5f0;
            border-color: #f0d8c4;
            color: #b8552e;
        }
        .building-chip.shop:hover {
            background: linear-gradient(135deg, #c8552e 0%, #a03a1c 100%);
            color: #fff;
        }
        .building-chip small {
            display: block;
            font-size: 9px;
            font-weight: 400;
            margin-top: 2px;
            opacity: 0.7;
        }

        /* 户型 */
        .layout-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }
        .layout-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .layout-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(139, 111, 71, 0.15);
        }
        .layout-cover {
            background: linear-gradient(135deg, #f5efe6 0%, #e8dfd0 100%);
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid #f0e8d8;
        }
        .layout-name {
            font-size: 22px;
            font-weight: 700;
            color: #6b5435;
            font-family: 'STSong', '宋体', serif;
        }
        .layout-area {
            font-size: 28px;
            font-weight: 700;
            color: #8b6f47;
        }
        .layout-area sup {
            font-size: 14px;
            opacity: 0.7;
            margin-left: 2px;
        }
        .layout-img {
            width: 100%;
            display: block;
            background: #f5efe6;
            min-height: 200px;
            object-fit: contain;
        }
        .layout-img-missing {
            padding: 60px 20px;
            text-align: center;
            color: #bbb;
            font-size: 13px;
            background: #faf8f5;
        }
        .layout-body {
            padding: 14px 18px;
        }
        .layout-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }
        .layout-features {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .layout-feature {
            background: #faf6ed;
            color: #6b5435;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
        }
        .layout-buildings {
            padding: 10px 18px 16px;
            border-top: 1px dashed #f0e8d8;
            font-size: 11px;
            color: #999;
        }
        .layout-buildings b {
            color: #6b5435;
            margin-right: 4px;
        }

        /* 销售概况 */
        .overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .kpi {
            background: #fff;
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .kpi .num {
            font-size: 24px;
            font-weight: 700;
            color: #6b5435;
        }
        .kpi .lbl {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        /* 户型详情弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 12px;
            max-width: 100%;
            max-height: 95vh;
            overflow: auto;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
        }
        .modal-img {
            display: block;
            max-width: 100%;
            max-height: 85vh;
        }
        .modal-empty {
            padding: 80px 40px;
            text-align: center;
            color: #999;
        }

        .footer {
            text-align: center;
            padding: 30px 16px 40px;
            color: #999;
            font-size: 11px;
            border-top: 1px solid #f0e8d8;
            margin-top: 30px;
        }
    </style>
</head>

        // 图片加载顺序: jpg → png → svg
        function tryImage(imgEl, paths) {
            let idx = 0;
            function tryNext() {
                if (idx >= paths.length) {
                    const key = imgEl.id === 'modalImg' ? '' : imgEl.id.replace('img-','');
                const showName = key && layouts[key] ? layouts[key].name : '该户型';
                imgEl.outerHTML = '<div class="layout-img-missing">户型图待补充<br><small>请将 ' + showName + ' 户型图保存为 floorplans/' + (key || 'key') + '.jpg</small></div>';
                    return;
                }
                const t = new Image();
                t.onload = () => { imgEl.src = t.src; };
                t.onerror = () => { idx++; tryNext(); };
                t.src = paths[idx];
            }
            tryNext();
        }

        function loadFloorplan(key) {
            const img = document.getElementById('img-' + key);
            if (!img) return;
            tryImage(img, [
                'floorplans/' + key + '.jpg',
                'floorplans/' + key + '.png',
                'floorplans/' + key + '.svg'
            ]);
        }

        function openLayout(key, name) {
